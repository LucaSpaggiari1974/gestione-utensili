<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catalogo utensili - anteprima</title><style>body{font-family:system-ui;margin:0;background:#f3f6f9;color:#203040}main{max-width:1000px;margin:auto;padding:16px}header{background:#123a5a;color:white;padding:20px;border-radius:16px}input,select{padding:12px;border:1px solid #ccd8e2;border-radius:8px;font:inherit;margin:4px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:12px}.card{background:white;border:1px solid #d8e3ec;border-radius:12px;padding:14px}.tag{color:#185b8f;background:#e9f2fb;border-radius:999px;padding:4px 8px;font-size:12px}svg{width:100%;height:150px;background:#f8fbfd;border-radius:8px}.muted{color:#607487;font-size:13px}</style></head><body><main><header><h1>🔧 Catalogo utensili</h1><p>Anteprima: inserti, punte e frese</p></header><p><input id="q" placeholder="Cerca codice, famiglia o produttore"><select id="cat"><option value="">Tutte le categorie</option><option>Inserti</option><option>Punte</option><option>Frese</option></select></p><div id="list" class="grid"></div><p class="muted">Dati dimostrativi: la versione completa userà fonti ufficiali e aggiornamenti verificati.</p></main><script>const data=[{c:'Inserti',code:'CNMG 120408',maker:'Sandvik Coromant',info:'Tornitura · ISO P/M/K'},{c:'Inserti',code:'TCMT21.52-UM 1125',maker:'Sandvik Coromant',info:'Tornitura · grado 1125'},{c:'Punte',code:'DRILL FIX',maker:'Kennametal',info:'Foratura indexabile'},{c:'Punte',code:'Perfomax',maker:'Seco Tools',info:'Punta a inserti'},{c:'Frese',code:'MFH-MAX',maker:'Kyocera',info:'Fresatura indexabile'},{c:'Frese',code:'MA90',maker:'Kyocera',info:'Fresatura indexabile'}];const list=document.querySelector('#list');function draw(){const q=document.querySelector('#q').value.toLowerCase(),c=document.querySelector('#cat').value;list.innerHTML=data.filter(x=>(!q||JSON.stringify(x).toLowerCase().includes(q))&&(!c||x.c===c)).map(x=>'<article class="card"><svg viewBox="0 0 240 150"><rect width="240" height="150" fill="#eef3f7"/><polygon points="120,20 210,75 120,130 30,75" fill="#b9c8d4" stroke="#123a5a" stroke-width="6"/><circle cx="120" cy="75" r="18" fill="#eef3f7" stroke="#123a5a" stroke-width="5"/></svg><p><span class="tag">'+x.c+'</span></p><h2>'+x.code+'</h2><p>'+x.maker+'<br>'+x.info+'</p></article>').join('')}q.oninput=cat.onchange=draw;draw();</script></body></html>
