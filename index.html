<!-- Correzione touch iPhone: apertura anteprima inserto tramite pointerup/click delegati. -->
<script>
(() => {
  let lastTouchPreview = 0;
  const getTool = (target) => {
    const row = target && target.closest ? target.closest('tr.data') : null;
    if (!row || typeof data === 'undefined') return null;
    const index = Number(row.dataset.i);
    return Number.isInteger(index) ? data[index] : null;
  };
  const openFromTouch = (event) => {
    if (event.pointerType === 'mouse') return;
    const tool = getTool(event.target);
    if (!tool || typeof openTool !== 'function') return;
    event.preventDefault();
    event.stopPropagation();
    if (typeof isInsertRecord === 'function' && isInsertRecord(tool) && typeof openInsertPreview === 'function') {
      openInsertPreview(tool);
    } else {
      openTool(tool);
    }
    lastTouchPreview = Date.now();
  };
  const openFromClick = (event) => {
    if (Date.now() - lastTouchPreview < 800) return;
    const tool = getTool(event.target);
    if (!tool || typeof openTool !== 'function') return;
    if (typeof isInsertRecord === 'function' && isInsertRecord(tool) && typeof openInsertPreview === 'function') {
      openInsertPreview(tool);
    } else {
      openTool(tool);
    }
  };
  document.addEventListener('pointerup', openFromTouch, { passive: false, capture: true });
  document.addEventListener('click', openFromClick, { capture: true });
})();
</script>
